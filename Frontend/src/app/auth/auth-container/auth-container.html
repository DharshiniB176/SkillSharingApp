<div class="relative min-h-screen flex items-center justify-center bg-[var(--bg-main)] overflow-hidden px-4">

  <div class="absolute -top-32 -left-32 w-96 h-96 bg-[var(--primary)] opacity-20 rounded-full blur-3xl animate-float-slow"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-[var(--primary-hover)] opacity-20 rounded-full blur-3xl animate-float-delay"></div>

<div class="relative w-full max-w-4xl overflow-hidden rounded-2xl shadow-2xl
            bg-[var(--bg-card)]/80 backdrop-blur-xl
            border border-[var(--border-color)]
            transition-all duration-700
            animate-auth-scale">

<div class="flex w-[200%]
            transition-all duration-700 ease-[cubic-bezier(0.4,0,0.2,1)]"
     [class.translate-x-[-50%]]="isRegister()"
     [class.opacity-90]="isRegister()">

      <div class="w-1/2 grid grid-cols-1 md:grid-cols-2">
        <div class="hidden md:flex flex-col justify-center items-center bg-[var(--primary)] text-[var(--text-inverse)] p-10">
          <h1 class="text-4xl font-bold mb-3">SkillSharing</h1>
          <p class="text-sm text-center opacity-90 max-w-xs">
            Learn skills. Share knowledge. Shape your career.
          </p>
        </div>

        <div class="p-8 sm:p-10">
          <app-login></app-login>
          <p class="text-sm text-center text-[var(--text-muted)] mt-6">
            Don’t have an account?
            <span class="text-[var(--primary)] cursor-pointer hover:underline"
                  (click)="showRegister()">Register</span>
          </p>
        </div>
      </div>

      <div class="w-1/2 grid grid-cols-1 md:grid-cols-2">
        <div class="p-8 sm:p-10 order-2 md:order-1">
          <app-register></app-register>
          <p class="text-sm text-center text-[var(--text-muted)] mt-6">
            Already registered?
            <span class="text-[var(--primary)] cursor-pointer hover:underline"
                  (click)="showLogin()">Login</span>
          </p>
        </div>

        <div class="hidden md:flex flex-col justify-center items-center bg-[var(--primary)] text-[var(--text-inverse)] p-10 order-1 md:order-2">
          <h1 class="text-4xl font-bold mb-3">Join SkillSharing</h1>
          <p class="text-sm text-center opacity-90 max-w-xs">
            Start learning, teaching, and growing today.
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
