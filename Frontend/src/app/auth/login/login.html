<h2 class="text-2xl font-semibold text-[var(--text-main)] mb-1">
  Welcome back 👋
</h2>

<p class="text-sm text-[var(--text-muted)] mb-6">
  Login to continue your growth
</p>

<form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-5">

  <div class="space-y-4">

    <div [class.animate-shake]="shakeEmail()" class="transition"
      [class.border-[var(--error)]]="email.touched && email.invalid">

      <label class="block text-sm text-[var(--text-muted)] mb-1">
        Email
      </label>

      <input pInputText type="email" formControlName="email" placeholder="Enter Your Email" (blur)="onEmailBlur()"
        class="w-full h-11
               bg-[var(--bg-input)]
               text-[var(--text-main)]
               border
               rounded-lg px-4
               focus:ring-2 focus:ring-[var(--primary)]
               focus:outline-none" [class.border-[var(--error)]]="email.touched && email.invalid"
        [class.border-[var(--border-color)]]="!email.touched || email.valid" />

      @if (email.touched && email.invalid) {
      <p class="text-xs text-[var(--error)] mt-1">
        Enter a valid email address
      </p>
      }

    </div>

    <div [class.animate-shake]="shakePassword()" class="transition w-full">

      <label class="block text-sm text-[var(--text-muted)] mb-1">
        Password
      </label>

      <p-password formControlName="password" [feedback]="false" [toggleMask]="true" placeholder="Enter Password" (onBlur)="onPasswordBlur()"
        styleClass="w-full" inputStyleClass="
      w-full h-11
      bg-[var(--bg-input)]
      text-[var(--text-main)]
      border border-[var(--border-color)]
      rounded-lg px-4
      focus:ring-2 focus:ring-[var(--primary)]
      focus:outline-none
    " [inputStyleClass]="
      (password.touched && password.invalid)
        ? 'w-full h-11 bg-[var(--bg-input)] text-[var(--text-main)] border border-[var(--error)] rounded-lg px-4 focus:ring-2 focus:ring-[var(--primary)] focus:outline-none'
        : 'w-full h-11 bg-[var(--bg-input)] text-[var(--text-main)] border border-[var(--border-color)] rounded-lg px-4 focus:ring-2 focus:ring-[var(--primary)] focus:outline-none'
    ">
      </p-password>

      @if (password.touched && password.invalid) {
      <p class="text-xs text-[var(--error)] mt-1">
        Minimum 8 characters, 1 uppercase & 1 special character
      </p>
      }

    </div>


  </div>

  <button tabindex="0" type="submit" class="w-full py-3 rounded-lg
           bg-[var(--primary)]
           text-[var(--text-inverse)]
           font-medium transition
           hover:scale-[1.02] active:scale-[0.98]
           shadow-lg" []="loginForm.invalid">
    Login
  </button>

</form>

<div class="flex items-center gap-3 my-6">
  <div class="flex-1 h-px bg-[var(--border-color)]"></div>
  <span class="text-sm text-[var(--text-muted)]">or continue with</span>
  <div class="flex-1 h-px bg-[var(--border-color)]"></div>
</div>

<div class="flex gap-4 justify-center">

  <button
    type="button"
    class="w-14 h-14 flex items-center justify-center
           bg-[var(--bg-input)]
           border border-[var(--border-color)]
           rounded-xl
           transition hover:scale-105"
    (click)="loginWithGoogle()">
    <img src="assets/icons/google.png" class="w-6 h-6" />
  </button>

  <button
    type="button"
    pTooltip="Coming soon"
    tooltipPosition="top"
    class="w-14 h-14 flex items-center justify-center
           bg-[var(--bg-input)]
           border border-[var(--border-color)]
           rounded-xl
           transition hover:scale-105
           cursor-not-allowed"
  [disabled]="true"
    (click)="loginWithFacebook()">
    <img src="assets/icons/facebook.png" class="w-6 h-6" />
  </button>

  <button
    type="button"
    pTooltip="Coming soon"
    tooltipPosition="top"
    class="w-14 h-14 flex items-center justify-center
           bg-[var(--bg-input)]
           border border-[var(--border-color)]
           rounded-xl
           transition hover:scale-105
           cursor-not-allowed"
    (click)="loginWithLinkedIn()"
    [disabled]="true">
    <img src="assets/icons/linkedin.png" class="w-6 h-6" />
  </button>

</div>
