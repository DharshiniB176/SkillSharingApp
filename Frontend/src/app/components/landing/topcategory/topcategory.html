
<section class="max-w-7xl mx-auto px-6 py-24">

  <div class="mb-12 text-center">
    <h3 class="text-3xl font-bold text-[var(--text-main)] mb-3">
      Top Categories
    </h3>
    <p class="text-[var(--text-muted)] max-w-xl mx-auto">
      Explore trending domains and start learning from experts
    </p>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-8">

    @for (category of categories; track category.id) {

      <div
        class="group bg-[var(--bg-card)]
               border border-[var(--border-color)]
               rounded-2xl p-6
               transition
               hover:-translate-y-2
               hover:shadow-2xl
               animate-card-fade
               flex flex-col items-center text-center">

        <div class="relative mb-6">

          <div
            class="absolute inset-0
                   w-24 h-24
                   rounded-2xl
                   bg-[var(--primary)]/15 p-3">
          </div>

          <img
            [src]="category.image"
            [alt]="category.title"
            class="relative z-10
                   w-24 h-24
                   object-contain
                   transition
                   group-hover:scale-110" />
        </div>

        <h4 class="text-lg font-semibold mb-3">
          {{ category.title }}
        </h4>

        <div class="flex justify-center gap-6 text-sm text-[var(--text-muted)]">

          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
            {{ category.courses }} Courses
          </span>

          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
            {{ category.workshops }} Workshops
          </span>

        </div>

      </div>

    }

  </div>

</section>
