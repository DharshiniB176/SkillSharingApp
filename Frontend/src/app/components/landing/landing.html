<div class="min-h-screen bg-(--bg-main) text-(--text-main)">

  <header class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
    <h1 class="text-xl font-semibold tracking-wide">
      SkillSharing
    </h1>

    <div class="flex items-center gap-4">
      <button
    (click)="theme.toggleTheme()"
    class="px-4 py-2 "
  >
    {{ theme.isDarkMode() ? '🌙 Dark' : '🌞 Light' }}
  </button>
      <button
        class="text-sm text-(--text-muted) hover:text-(--text-main) transition"
        (click)="goToLogin()">
        Login
      </button>

      <button
        class="px-4 py-2 rounded-lg
               bg-(--primary)
               text-(--text-inverse)
               font-medium
               transition hover:scale-[1.03]">
        Get Started
      </button>

    </div>
  </header>

  <section class="max-w-7xl mx-auto px-6 py-24 grid grid-cols-1 md:grid-cols-2 gap-16 items-center">

  <div class="animate-fade-left">
    <h2 class="text-4xl md:text-5xl font-bold leading-tight mb-6">
      Learn skills.<br />
      Share knowledge.<br />
      Grow your career.
    </h2>

    <p class="text-(--text-muted) text-lg mb-8 max-w-lg">
      SkillSharing helps you discover the right career path, learn from others,
      and teach what you know — all in one intelligent platform.
    </p>

    <div class="flex gap-4">
      <button
        class="px-6 py-3 rounded-lg
               bg-(--primary)
               text-(--text-inverse)
               font-medium
               transition hover:scale-[1.03]"
        (click)="goToRegister()">
        Start Learning
      </button>

      <button
        class="px-6 py-3 rounded-lg
               border border-(--border-color)
               text-(--text-main)
               font-medium
               transition hover:bg-(--bg-input)"
        (click)="goToLogin()">
        Login
      </button>
    </div>
  </div>

  <div class="relative flex justify-center animate-fade-right">

           <div
    class="absolute inset-0 rounded-3xl
           bg-(--primary)/20
           translate-y-6 translate-x-6
           pointer-events-none"
  ></div>

    <div class="relative z-10
                bg-(--bg-card)
                border border-(--border-color)
                rounded-2xl
                shadow-2xl
                p-3">

      <img
        src="assets/img/landingbg.jpeg"
        class="w-145 h-96 object-cover rounded-xl"
        alt="landingImg"/>
    </div>

  </div>

</section>

<app-topcategory></app-topcategory>

<app-popular-courses></app-popular-courses>
<app-courses></app-courses>


<app-how-it-works></app-how-it-works>

<app-join-now></app-join-now>
<app-testimonials></app-testimonials>


  <footer class="border-t border-(--border-color) py-6 text-center text-sm text-(--text-muted)">
    © 2025 SkillSharing. All rights reserved.
  </footer>

<p-scrollTop
  target="window"
  behavior="smooth"
  styleClass="scrolltop-btn"
/>

</div>
