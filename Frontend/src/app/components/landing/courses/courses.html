
<section class="max-w-7xl mx-auto px-6 py-24">

  <div class="flex items-center justify-between mb-10">
    <h3 class="text-3xl font-bold text-(--text-main)">
      Recommended courses for you
    </h3>

    <button
      class="text-sm font-medium
             text-(--primary)
             hover:underline">
      Explore courses →
    </button>
  </div>

  <p-carousel
    [value]="courses"
    [numVisible]="3"
    [numScroll]="1"
    [circular]="true"
    [showIndicators]="false"
    [showNavigators]="true"
    class="custom-carousel">

    <ng-template pTemplate="item" let-course>

      <div
        class="mx-3 bg-(--bg-card)
               border border-(--border-color)
               rounded-2xl overflow-hidden
               transition
               hover:-translate-y-2
               hover:shadow-2xl">

        <div class="relative">
          <img
            [src]="course.image"
            class="w-full h-48 object-cover" />

          <button
            class="absolute top-3 right-3
                   w-9 h-9
                   rounded-full
                   bg-white/90
                   flex items-center justify-center
                   text-sm">
            ❤
          </button>
        </div>

        <div class="p-5">

          <h4 class="font-semibold text-base mb-1">
            {{ course.title }}
          </h4>

          <p class="text-sm text-(--text-muted) mb-3">
            {{ course.author }}
          </p>

          <div class="flex items-center gap-4 text-sm text-(--text-muted) mb-3">
            <span>⏱ {{ course.hours }}h {{ course.minutes }}m</span>
            <span>⭐ {{ course.rating }}</span>
          </div>

          <div class="flex items-center gap-2">
            <span class="text-lg font-semibold text-(--primary)">
              ${{ course.price }}
            </span>
            @if (course.oldPrice) {
              <span class="text-sm line-through text-(--text-muted)">
                ${{ course.oldPrice }}
              </span>
            }
          </div>

        </div>

      </div>

    </ng-template>

  </p-carousel>

</section>
