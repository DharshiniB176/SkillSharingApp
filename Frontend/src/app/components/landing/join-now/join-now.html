<section class="py-24">

  <div
    class="relative max-w-7xl mx-auto px-6
           bg-gradient-to-r
           from-[#050914] to-[#0b1022]
           rounded-3xl
           overflow-hidden">

    <div
      class="grid grid-cols-1 md:grid-cols-2
             gap-16 items-center
             px-10 py-20">

      <!-- LEFT CONTENT -->
      <div class="relative z-10">

        <h2
          class="text-4xl md:text-5xl font-bold
                 text-white leading-tight mb-6">
          Advance personal,<br />
          professional goals with<br />
          SkillSharing today
        </h2>

        <p class="text-white/70 max-w-lg mb-10">
          Join us in taking the next step towards realizing your dreams
          and unlocking a brighter future. Start your journey with
          SkillSharing today.
        </p>

        <button
          class="px-8 py-4 rounded-xl
                 bg-white text-black
                 font-semibold
                 transition
                 hover:scale-[1.05]"
          (click)="goToRegister()">
          Join Now
        </button>

<svg
  class="absolute -top-6 left-10
         w-10 h-10"
  viewBox="0 0 24 24"
  fill="none">

  <path
    d="M12 2
       L13.5 9
       L21 12
       L13.5 15
       L12 22
       L10.5 15
       L3 12
       L10.5 9 Z"
    fill="#facc15"/>
</svg>

      </div>

      <!-- RIGHT IMAGE -->
      <div class="relative flex justify-center items-center">
        

        <!-- BLUE BACKGROUND RECT -->
        <div
          class="absolute
                 w-72 h-96
                 bg-[#8fe3ef]
                 rounded-3xl
                 translate-x-6 translate-y-6">
        </div>

        <!-- PERSON IMAGE -->
        <img
          src="assets/img/cta-person-img.png"
          alt="CTA Person"
          class="relative
                 h-[420px]
                 object-cover
                 rounded-3xl
                 shadow-2xl" />

        <!-- DECORATIVE STARS -->
        <svg
          class="absolute -top-6 left-10
                 w-6 h-6 text-yellow-400"
          viewBox="0 0 24 24"
          fill="currentColor">
          <path d="M12 2 L14 9 L22 12 L14 15 L12 22 L10 15 L2 12 L10 9 Z"/>
        </svg>

        <svg
          class="absolute top-24 right-6
                 w-5 h-5 text-yellow-400"
          viewBox="0 0 24 24"
          fill="currentColor">
          <path d="M12 2 L14 9 L22 12 L14 15 L12 22 L10 15 L2 12 L10 9 Z"/>
        </svg>

      </div>

    </div>

  </div>

</section>
