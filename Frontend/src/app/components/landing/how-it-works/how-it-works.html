<section class="max-w-7xl mx-auto px-6 py-24">

  <div class="text-center mb-16">
    <h3 class="text-3xl font-bold text-[var(--text-main)] mb-3">
      How SkillSharing Works
    </h3>
    <p class="text-[var(--text-muted)] max-w-xl mx-auto">
      A simple, guided journey from learning to real career growth
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-10">

    @for (step of steps; track step.id) {

      <div
        class="group bg-[var(--bg-card)]
               border border-[var(--border-color)]
               rounded-2xl p-8
               text-center
               transition
               hover:-translate-y-2
               hover:shadow-2xl
               animate-card-fade">

        <div
          class="w-16 h-16 mx-auto mb-6
                 rounded-2xl
                 flex items-center justify-center
                 bg-[var(--primary)]/15
                 text-2xl
                 transition
                 group-hover:scale-110">
          {{ step.icon }}
        </div>

        <h4 class="text-lg font-semibold mb-3">
          {{ step.title }}
        </h4>

        <p class="text-sm text-[var(--text-muted)] leading-relaxed">
          {{ step.description }}
        </p>

      </div>

    }

  </div>

</section>
