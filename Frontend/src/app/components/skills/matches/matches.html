<div class="space-y-8">

  <div>
    <h1 class="text-2xl font-semibold text-[var(--text-main)]">
      Skill Matches
    </h1>

    <p class="text-sm text-[var(--text-muted)]">
      People you can learn from
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    @for (match of matches; track match.userId) {

      <div
        class="bg-[var(--bg-card)]
               border border-[var(--border-color)]
               rounded-xl p-6
               shadow-sm
               hover:shadow-md
               transition">

        <div class="flex items-center justify-between mb-3">

          <h3 class="font-semibold text-[var(--text-main)]">
            {{ match.userName }}
          </h3>

          <span
            class="text-xs px-2 py-1 rounded-full
                   bg-[var(--bg-input)]
                   border border-[var(--border-color)]">

            {{ match.level }}

          </span>

        </div>

        <p class="text-sm text-[var(--text-muted)] mb-4">
          Teaches {{ match.skillName }}
        </p>

        <button
          class="w-full py-2 rounded-lg text-sm font-medium
                 bg-[var(--primary)]
                 text-[var(--text-inverse)]
                 hover:bg-[var(--primary-hover)]
                 transition">

          Request Session

        </button>

      </div>

    }

  </div>

</div>
