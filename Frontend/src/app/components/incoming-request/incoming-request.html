<div class="space-y-6">

  <h1 class="text-2xl font-semibold text-(--text-main)">
    Incoming Requests
  </h1>

  <div class="space-y-4">

    @for (request of requests; track request.id) {

      <div
        class="bg-(--bg-card)
               border border-(--border-color)
               rounded-xl p-4">

        <p class="text-(--text-main)">

          <strong>{{ request.requester.fullName }}</strong>
          wants to learn
          <strong>{{ request.skill.name }}</strong>

        </p>

        <div class="flex gap-3 mt-3">

          <button
            (click)="acceptRequest(request)"
            class="px-4 py-1 rounded-lg bg-green-600 text-white">

            Accept

          </button>

          <button
            (click)="rejectRequest(request)"
            class="px-4 py-1 rounded-lg bg-red-600 text-white">

            Reject

          </button>

        </div>

      </div>

    }

  </div>

</div>
