 <aside
  class="fixed md:relative z-40 h-full
         bg-(--bg-card)
         border-r border-(--border-color)
         transition-all duration-300
         flex flex-col
         text-(--text-main)"

  [class.w-64]="open && !mini"
  [class.w-14]="open && mini"
  [class.-translate-x-full]="!open"
  [class.translate-x-0]="open">

  <div class="h-16 flex items-center justify-between px-3
              border-b border-(--border-color)">

    <span class="font-semibold truncate" [class.hidden]="mini">
      SkillSharing
    </span>

    <button
      class="hidden md:flex w-8 h-8 items-center justify-center
             rounded-lg hover:bg-(--primary)/10"
      (click)="toggleMini.emit()">
      ☰
    </button>

    <button
      class="md:hidden w-8 h-8 flex items-center justify-center
             rounded-lg hover:bg-(--primary)/10"
      (click)="close.emit()">
      ✕
    </button>

  </div>
<nav class="flex-1 p-2 space-y-2">

  @for (item of menu; track item.route) {

    <button
      class="w-full flex items-center justify-center md:justify-start
             gap-3 px-3 py-2 rounded-lg
             hover:bg-(--primary)/10"
      (click)="navigate(item.route)">

      <i [class]="item.icon" class="text-lg"></i>

      <span [class.hidden]="mini">
        {{ item.label }}
      </span>

    </button>

  }

</nav>
</aside>
