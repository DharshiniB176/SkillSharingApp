<div class="space-y-8">

  <div class="flex items-center justify-between">

    <div>
      <h1 class="text-2xl font-semibold text-(--text-main)">
        Courses
      </h1>

      <p class="text-sm text-(--text-muted)">
        Learn new skills from experts
      </p>
    </div>

    <button
      (click)="openAddCourse()"
      class="px-4 py-2 rounded-lg text-sm font-medium
             bg-(--primary) text-(--text-inverse)
             hover:bg-(--primary-hover)
             transition">

      <i class="pi pi-plus mr-2"></i>
      Add Course

    </button>

  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

    @for (course of courses; track course.id) {

      <div (click)="goToCourse(course.id)"
           class="cursor-pointer bg-(--bg-card) border border-(--border-color)
            rounded-xl overflow-hidden shadow-sm hover:shadow-md transition">


        <img
          [src]="course.thumbnailUrl || 'https://via.placeholder.com/300'"
          class="w-full h-40 object-cover" />


        <div class="p-4 space-y-2">

          <h3 class="font-semibold text-(--text-main)">
            {{ course.title }}
          </h3>

          <p class="text-sm text-(--text-muted) line-clamp-2">
            {{ course.description }}
          </p>

          <p class="text-xs text-(--text-muted)">
            By {{ course.author?.fullName }}
          </p>

          <div class="flex justify-between items-center text-xs mt-2">

            <span class="px-2 py-1 bg-(--bg-input) rounded">
              {{ course.level }}
            </span>

            <span class="text-(--text-main)">
              {{ course.duration }}
            </span>

          </div>

        </div>

      </div>

    }

  </div>

</div>

<app-add-course (courseAdded)="ngOnInit()"></app-add-course>
